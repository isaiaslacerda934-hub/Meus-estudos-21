
name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extrair projeto Android
        run: |
          unzip -o MeuControleDeEstudos_Projeto_Android_v2.zip -d source
          test -f source/MeuControleDeEstudosAndroid/build.gradle

      - name: Compilar APK
        working-directory: source/MeuControleDeEstudosAndroid
        run: gradle --no-daemon assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Meu-Controle-de-Estudos-APK
          path: source/MeuControleDeEstudosAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
